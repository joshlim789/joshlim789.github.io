project:
  type: website
  output-dir: _site
  resources:
    - files/**

website:
  title: "Joshua Lim"
  description: "Joshua Lim — Ph.D. student in Statistical Science at Duke University, working on causal inference, missing data, and Bayesian machine learning."
  site-url: "https://joshlim789.github.io/"
  repo-url: "https://github.com/joshlim789/joshlim789.github.io"

  open-graph: true
  page-navigation: false

  navbar:
    background: "#012169"
    foreground: "#ffffff"
    pinned: true
    title: "Joshua Lim"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/joshlim789
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/joshua-lim-47619a229/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:josh.lim@duke.edu
        aria-label: Email

  page-footer:
    background: "#012169"
    foreground: "#ffffff"
    left: "&copy; 2026 Joshua Lim"
    center: "Department of Statistical Science · Duke University"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: [cosmo, style/josh.scss]
      dark: [cosmo, style/josh-dark.scss]
    toc: false
    grid:
      body-width: 980px
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false

execute:
  freeze: auto
