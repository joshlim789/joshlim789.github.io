project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!**/README*.md"
    # instructor solution manual: built on demand, never published
    - "!slides/solutions.qmd"
  resources:
    - files/**
    # anything dropped in here is published, referenced by a page or not
    - img/other/**
    # ...except the folder's own notes and macOS cruft
    - "!img/other/README.md"
    - "!img/other/.DS_Store"

website:
  title: "Joshua Lim"
  description: "Joshua Lim — Ph.D. candidate in Statistical Science at Duke University, working on causal inference and missing data."
  site-url: "https://joshlim789.github.io/"
  repo-url: "https://github.com/joshlim789/joshlim789.github.io"

  open-graph: true
  page-navigation: false

  navbar:
    background: "#012169"
    foreground: "#ffffff"
    pinned: true
    title: "Joshua Lim"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: other.qmd
        text: Other
    right:
      - icon: github
        href: https://github.com/joshlim789
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/joshua-lim789/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:josh.lim@duke.edu
        aria-label: Email

  page-footer:
    background: "#012169"
    foreground: "#ffffff"
    left: "&copy; 2026 Joshua Lim"
    center: "Department of Statistical Science · Duke University"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: [cosmo, style/josh.scss]
      dark: [cosmo, style/josh-dark.scss]
    toc: false
    grid:
      body-width: 980px
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false

execute:
  freeze: auto
